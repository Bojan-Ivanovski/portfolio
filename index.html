<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--seo-head-->
    <meta name="theme-color" content="#146c94" />
    <link rel="icon" href="%BASE_URL%Favicon/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%BASE_URL%Favicon/favicon-32x32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%BASE_URL%Favicon/apple-touch-icon.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&amp;family=Orbitron:wght@400;500;600;700&amp;family=Sacramento&amp;display=swap"
    />
    <link rel="sitemap" type="application/xml" href="%BASE_URL%sitemap.xml" />
    <script>
      // Preserve legacy hash-route bookmarks using a full navigation to static HTML.
      if (location.hash.startsWith("#/")) {
        const legacy = location.hash.slice(2);
        const [route, query] = legacy.split("?");
        if (["", "Projects", "MoreAboutMe"].includes(route)) {
          location.replace(
            "%BASE_URL%" +
              (route ? route + "/" : "") +
              (query ? "?" + query : ""),
          );
        }
      }
      try {
        const saved = localStorage.getItem("darkMode");
        document.documentElement.dataset.theme = (
          saved === null
            ? matchMedia("(prefers-color-scheme: dark)").matches
            : saved === "true"
        )
          ? "dark"
          : "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
